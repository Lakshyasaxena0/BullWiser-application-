services:
  - type: web
    name: bullwiser-application
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, sync: false }
      - { key: SESSION_SECRET, generateValue: true }
      - { key: APP_URL, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
      - { key: Groq_API_key, sync: false }
      - { key: BREVO_API_KEY, sync: false }
      - { key: MAIL_FROM, sync: false }
      - { key: RAZORPAY_KEY_ID, sync: false }
      - { key: RAZORPAY_KEY_SECRET, sync: false }
      - { key: RAZORPAY_WEBHOOK_SECRET, sync: false }
      - { key: PAYWALL_ENABLED, sync: false }
      - { key: COINGECKO_API_KEY, sync: false }
      - { key: FINNHUB_API_KEY, sync: false }
